profile_version = 1
profile_name = "example"
description = "Example PLU sanitization profile; confirm values before customer use"

[safety]
fill_empty_only = true
preserve_nonempty_values = true
reject_invalid_results = true

[[rules]]
field = "department"
when = "empty"
action = "set_constant"
value = "1"

[[rules]]
field = "barcode"
when = "empty"
action = "copy_field"
source_field = "plu_code"
normalization = "numeric_no_padding"

[[rules]]
field = "barcode_format"
when = "empty"
action = "set_constant"
value = "05"

[[rules]]
field = "print_format_code"
when = "empty"
action = "set_constant"
value = "00"

# Optional explicit rule for source Pludata."Best Before" -> DIGIweb plusellingdateterm.
# Enable only when the customer wants invalid selling-date terms rewritten in memory.
# With this example configuration, 0 is preserved as disabled/default, 1..999 are
# preserved, and empty, malformed, negative, or >999 values become 0.
#
# [selling_date_term]
# enabled = true
# allow_zero = true
# minimum = 1
# maximum = 999
# invalid_value = 0
# empty_value = 0
