[digiweb]
# Change this to the customer DIGIweb host or base URL.
base_url = "https://CHANGE_ME"

# For testing deployments this may be set here. For routine use, prefer
# TO_DIGI_RS_CLIENT_SECRET or TO_DIGI_RS_CLIENT_SECRET_FILE so secrets stay out
# of edited config files and shell history.
client_secret = "CHANGE_ME"

# Visible for review; defaults to 1 when omitted.
store_number = 1

# Set true only for customer systems that use self-signed certificates.
allow_invalid_certificates = true

[profiles]
# Initialized Starsky deployments use the built-in Starsky profile by default.
# Use `./to-digi analyze --raw` to inspect the source without any profile.
default = "starsky"
