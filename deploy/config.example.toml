[digiweb]
# Change this to the customer DIGIweb host or base URL.
base_url = "https://CHANGE_ME"

# For testing deployments this may be set here. For routine use, prefer
# TO_DIGI_RS_CLIENT_SECRET or TO_DIGI_RS_CLIENT_SECRET_FILE so secrets stay out
# of edited config files and shell history.
client_secret = "CHANGE_ME"

# Visible for review; defaults to 1 when omitted.
store_number = 1

# Set true only for customer systems that use self-signed certificates.
allow_invalid_certificates = true

[timeouts]
# Shared cadence for polling accepted asynchronous requests.
poll_interval_millis = 500

[import]
# Use 1 for the original strictly sequential submit-then-poll behavior.
max_in_flight = 16

[profiles]
# Generic deployments do not apply a sanitization profile by default.
# Set to "starsky", "bigway", or use --sanitize-profile for a customer-specific file.
default = ""

[verification]
# Fill these only after an operator independently confirms the objects exist in DIGIweb.
# Do not copy values from the MDB without checking the server setup.
confirmed_departments = []
confirmed_groups = []
confirmed_label_formats = []
