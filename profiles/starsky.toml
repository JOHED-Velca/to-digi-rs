profile_version = 1
profile_name = "starsky"
description = "Starsky defaults for missing required PLU fields and invalid Best Before terms"

[safety]
fill_empty_only = true
preserve_nonempty_values = true
reject_invalid_results = true

[[rules]]
field = "department"
when = "empty"
action = "set_constant"
value = "1"

[[rules]]
field = "barcode"
when = "empty"
action = "copy_field"
source_field = "plu_code"
normalization = "numeric_no_padding"

[[rules]]
field = "barcode_format"
when = "empty"
action = "set_constant"
value = "05"

[[rules]]
field = "print_format_code"
when = "empty"
action = "set_constant"
value = "00"

[selling_date_term]
enabled = true
allow_zero = true
minimum = 1
maximum = 999
invalid_value = 0
empty_value = 0
